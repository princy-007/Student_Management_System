<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <h2>Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Enter Username">

        <input
            type="password"
            id="password"
            placeholder="Enter Password">

        <button onclick="login()">
            Login
        </button>

        <p id="message"></p>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
